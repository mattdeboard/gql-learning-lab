type Project @key(fields: "id") {
  id: ID!
  name: String
  latitude: Float
  longitude: Float
}

type DailyLog @key(fields: "id") {
  id: ID!
  project: Project
  date: String
  status: Status
  createdBy: User
}

enum Status {
  APPROVED
  DRAFT
  SUBMITTED
}

type User @key(fields: "id", resolvable: false) {
  id: ID!
}

input DailyLogQueryInput {
  projectId: ID
  date: String
  status: Status
}

input CreateDailyLogInput {
  projectId: ID!
  date: String!
  status: Status!
}

input UpdateDailyLogInput {
  id: ID!
  status: Status
}

type Query {
  dailyLogsBy(filters: DailyLogQueryInput!): [DailyLog]
  dailyLogsForCurrentUser: [DailyLog]
}

type Mutation {
  createLog(options: CreateDailyLogInput): DailyLog
  deleteLog(id: ID!): DailyLog
  updateLog(options: UpdateDailyLogInput!): DailyLog
}

extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
