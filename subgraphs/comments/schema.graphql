type Comment @key(fields: "id") {
  id: ID!
  photo: Photo
  author: User
  body: String!
  createdAt: String!
}

type Photo @key(fields: "id") {
  id: ID!
  comments: [Comment]
}

type User @key(fields: "id") {
  id: ID!
  comments: [Comment]
}

type Query {
  commentsForPhoto(photoId: ID!): [Comment]
  commentsForUser(userId: ID!): [Comment]
}

extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable"])
